[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DEApp"
version = "0.1.0"
description = "Data Extraction Application for automated email data extraction and Excel workbook updating."
readme = "README.md"
requires-python = ">=3.14.7"
license = { file = "LICENSE" }

authors = [
    { name = "Idorenyin Umoh" }
]

dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4",
    "lxml",
    "dateparser>=1.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
deapp = "deapp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"